<script>
/* ---------------------------------------------------------------
 * 設定驅動的通用 CRUD 元件：每個 entity 定義欄位後，
 * 表單與表格會自動產生，不用每個分頁各寫一份 HTML/JS。
 * ------------------------------------------------------------- */
const ENTITIES = {
  vehicles: {
    label: '車型主檔', pk: 'VehicleID',
    getFn: 'getVehicles', saveFn: 'saveVehicle', deleteFn: 'deleteVehicle',
    scoped: false,
    fields: [
      { name: 'VehicleID', label: '車型代號', required: true },
      { name: 'VehicleSeries', label: '車系(如DA)' },
      { name: 'VehicleCode', label: '車型名稱(如9人客貨車)' },
      { name: 'Status', label: '狀態', type: 'select', options: ['現況', '開發中', '量產'] },
      { name: 'Notes', label: '備註' }
    ]
  },
  scenarios: {
    label: '情境主檔', pk: 'ScenarioID',
    getFn: 'getScenarios', saveFn: 'saveScenario', deleteFn: 'deleteScenario',
    scoped: false,
    fields: [
      { name: 'ScenarioID', label: '情境代號', required: true },
      { name: 'ScenarioName', label: '情境名稱(如目標/現況)' },
      { name: 'VehicleSeries', label: '車系' },
      { name: 'BaseScenarioID', label: '衍生自(情境代號)' },
      { name: 'CreatedDate', label: '建立日期', type: 'date' },
      { name: 'Notes', label: '備註' }
    ]
  },
  salesmix: {
    label: '銷售構成與售價', pk: 'RowID',
    getFn: 'getSalesMix', saveFn: 'saveSalesMixRow', deleteFn: 'deleteSalesMixRow',
    scoped: true,
    fields: [
      { name: 'RowID', label: 'RowID', readOnlyOnEdit: true, hiddenOnCreate: true },
      { name: 'VehicleID', label: '車型代號', required: true },
      { name: 'SalesMixPct', label: '銷售構成比(0~1)', type: 'number' },
      { name: 'MonthlyVolume', label: '預估銷售台數(月)', type: 'number' },
      { name: 'LifeCycleYears', label: 'LC年限', type: 'number' },
      { name: 'ListPriceTaxIncl', label: '建議零售價(含稅)', type: 'number' },
      { name: 'MandatoryAccessoryPrice', label: '強配件售價', type: 'number' },
      { name: 'ScrapFee', label: '廢車處理費', type: 'number' },
      { name: 'EffectiveDate', label: '生效日', type: 'date' },
      { name: 'Notes', label: '備註' }
    ]
  },
  materialcost: {
    label: '材料成本', pk: 'RowID',
    getFn: 'getMaterialCost', saveFn: 'saveMaterialCostRow', deleteFn: 'deleteMaterialCostRow',
    scoped: true,
    fields: [
      { name: 'RowID', label: 'RowID', hiddenOnCreate: true },
      { name: 'VehicleID', label: '車型代號', required: true },
      { name: 'CostType', label: '採購模式', type: 'select', options: ['LP', 'KD'] },
      { name: 'CostCategory', label: '成本項目', type: 'select', optionsFn: 'getMaterialCostCategories' },
      { name: 'Amount', label: '金額', type: 'number' },
      { name: 'Currency', label: '幣別', type: 'select', options: ['TWD', 'CNY'] },
      { name: 'ExchangeRate', label: '匯率', type: 'number' },
      { name: 'Source', label: '來源說明' },
      { name: 'EffectiveDate', label: '生效日', type: 'date' }
    ]
  },
  devinvestment: {
    label: '開發總投', pk: 'RowID',
    getFn: 'getDevInvestment', saveFn: 'saveDevInvestmentRow', deleteFn: 'deleteDevInvestmentRow',
    scoped: true, scopedByVehicle: false,
    fields: [
      { name: 'RowID', label: 'RowID', hiddenOnCreate: true },
      { name: 'Department', label: '部門(可自行輸入新部門)', type: 'text-suggest', optionsFn: 'getKnownDepartments' },
      { name: 'AssetType', label: '資產類型', type: 'select', options: ['模具', '設備', '費用'] },
      { name: 'TNCAPFlag', label: 'TNCAP', type: 'select', options: ['對應TNCAP', '不對應TNCAP'] },
      { name: 'Amount', label: '金額', type: 'number' },
      { name: 'ChallengeReductionPct', label: '挑戰低減目標%(0~1)', type: 'number' },
      { name: 'Notes', label: '備註' },
      { name: 'EffectiveDate', label: '生效日', type: 'date' }
    ]
  },
  operatingexpense: {
    label: '營業費用(d/f1/h/J科目)', pk: 'RowID',
    getFn: 'getOperatingExpense', saveFn: 'saveOperatingExpenseRow', deleteFn: 'deleteOperatingExpenseRow',
    scoped: true,
    fields: [
      { name: 'RowID', label: 'RowID', hiddenOnCreate: true },
      { name: 'VehicleID', label: '車型代號', required: true },
      { name: 'LineCode', label: '科目', type: 'select', options: [
        ['d1', 'd1 廣宣費用'], ['d2', 'd2 促銷'], ['d3', 'd3 批標售'], ['d4', 'd4 0.5%Margin'], ['d5', 'd5 索賠'],
        ['f1', 'f1 直接歸屬費用'], ['h1', 'h1 固定營業費用'], ['h3', 'h3 品牌廣宣費用'], ['h4', 'h4 特別加發'], ['J', 'J 前瞻費用']
      ] },
      { name: 'Amount', label: '金額', type: 'number' },
      { name: 'Notes', label: '備註' },
      { name: 'EffectiveDate', label: '生效日', type: 'date' }
    ]
  },
  parameters: {
    label: '參數設定', pk: 'ParamID',
    getFn: 'getParameters', saveFn: 'saveParameterRow', deleteFn: 'deleteParameterRow',
    scoped: true,
    fields: [
      { name: 'ParamID', label: 'ParamID', hiddenOnCreate: true },
      { name: 'VehicleID', label: '車型代號(留空=全域)' },
      { name: 'ParamName', label: '參數名稱', type: 'select', options: ['營業稅率', '銷售佣金率', '季Margin率', '貨物稅率', '集團預算匯率', '現況匯率'] },
      { name: 'Value', label: '數值(比率請輸入0~1小數)', type: 'number' },
      { name: 'EffectiveDate', label: '生效日', type: 'date' }
    ]
  }
};

let currentScenarioId = '';
let currentTab = 'vehicles';

function switchTab(key) {
  currentTab = key;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
  if (key === 'dashboard') {
    refreshDashboard();
  } else if (ENTITIES[key]) {
    renderEntityPanel(key);
  }
}

function onScenarioChange(value) {
  currentScenarioId = value;
  document.querySelectorAll('.scenario-label').forEach(el => el.textContent = value || '(尚未選擇情境)');
  if (currentTab === 'dashboard') refreshDashboard();
  else if (ENTITIES[currentTab]) renderEntityPanel(currentTab);
}

function showGlobalError(err) {
  const box = document.getElementById('global-error');
  const msg = '發生錯誤：' + (err && err.message ? err.message : err);
  console.error(err);
  if (!box) { return; }
  box.textContent = msg;
  box.style.display = 'block';
}
function clearGlobalError() {
  const box = document.getElementById('global-error');
  if (box) box.style.display = 'none';
}

/** 包住 success handler 本體：伺服器呼叫成功後，前端渲染若還是丟例外，
 *  也要顯示在畫面上，而不是被 google.script.run 靜默吞掉、只留 console trace。 */
function safeHandler(fn) {
  return function () {
    try {
      clearGlobalError();
      return fn.apply(null, arguments);
    } catch (e) {
      showGlobalError(e);
    }
  };
}

function loadScenarioSelector(preferredId) {
  google.script.run
    .withSuccessHandler(safeHandler(scenarios => {
      scenarios = scenarios || [];
      const sel = document.getElementById('scenario-selector');
      sel.innerHTML = '<option value="">-- 選擇情境 --</option>' +
        scenarios.map(s => `<option value="${s.ScenarioID}">${s.ScenarioName || s.ScenarioID}</option>`).join('');
      const ids = scenarios.map(s => s.ScenarioID);
      // 優先順序：剛新增/編輯的情境 > 目前已選的情境(若還存在) > 第一筆
      const pick = (preferredId && ids.indexOf(preferredId) !== -1) ? preferredId
        : (currentScenarioId && ids.indexOf(currentScenarioId) !== -1) ? currentScenarioId
        : ids[0] || '';
      if (pick) {
        sel.value = pick;
        onScenarioChange(pick);
      } else {
        currentScenarioId = '';
      }
    }))
    .withFailureHandler(showGlobalError)
    .getScenarios();
}

/* ---------------- 通用表單/表格渲染 ---------------- */
function renderEntityPanel(key) {
  const cfg = ENTITIES[key];
  const panel = document.getElementById('panel-' + key);
  if (cfg.scoped && !currentScenarioId) {
    panel.innerHTML = '<p class="muted">請先在上方選擇情境</p>';
    return;
  }
  panel.innerHTML = `
    <h3>${cfg.label}</h3>
    <div id="form-container-${key}"></div>
    <div id="status-${key}" class="status-msg"></div>
    <div id="table-container-${key}"></div>
  `;
  renderForm(key, cfg);
  loadEntityData(key, cfg);
}

function renderForm(key, cfg) {
  const container = document.getElementById('form-container-' + key);
  const fieldsHtml = cfg.fields.map(f => {
    const id = `f-${key}-${f.name}`;
    if (f.hiddenOnCreate) {
      // RowID/ParamID 等系統自動產生的主鍵欄位：不用讓使用者看到空文字框，
      // 但編輯既有資料時(editRow)仍要能寫回這個 id，所以保留一個 hidden input。
      return `<input type="hidden" id="${id}"/>`;
    }
    let control;
    if (f.type === 'select') {
      control = `<select id="${id}"><option value=""></option></select>`;
    } else if (f.type === 'text-suggest') {
      control = `<input id="${id}" type="text" list="dl-${id}"/><datalist id="dl-${id}"></datalist>`;
    } else {
      control = `<input id="${id}" type="${f.type || 'text'}" step="any"${f.required ? ' required' : ''}/>`;
    }
    return `<label>${f.label}${f.required ? ' *' : ''} ${control}</label>`;
  }).join('');

  container.innerHTML = `
    <form class="entry-form" onsubmit="return submitEntityForm(event, '${key}')">
      ${fieldsHtml}
      <input type="hidden" id="edit-pk-${key}" value=""/>
      <button type="submit" class="btn">儲存</button>
      <button type="button" class="btn secondary" onclick="resetForm('${key}')">清空</button>
    </form>
  `;

  cfg.fields.forEach(f => {
    if (f.type === 'select' && f.options) {
      const sel = document.getElementById(`f-${key}-${f.name}`);
      f.options.forEach(opt => {
        const [val, text] = Array.isArray(opt) ? opt : [opt, opt];
        sel.insertAdjacentHTML('beforeend', `<option value="${val}">${text}</option>`);
      });
    } else if (f.optionsFn) {
      google.script.run
        .withSuccessHandler(safeHandler(list => {
          list = list || [];
          if (f.type === 'text-suggest') {
            const dl = document.getElementById(`dl-f-${key}-${f.name}`);
            dl.innerHTML = list.map(v => `<option value="${v}">`).join('');
          } else {
            const sel = document.getElementById(`f-${key}-${f.name}`);
            list.forEach(v => sel.insertAdjacentHTML('beforeend', `<option value="${v}">${v}</option>`));
          }
        }))
        .withFailureHandler(showGlobalError)
        [f.optionsFn]();
    }
  });
}

function resetForm(key) {
  ENTITIES[key].fields.forEach(f => { document.getElementById(`f-${key}-${f.name}`).value = ''; });
  document.getElementById(`edit-pk-${key}`).value = '';
}

function submitEntityForm(evt, key) {
  evt.preventDefault();
  const cfg = ENTITIES[key];
  const rowObj = {};
  cfg.fields.forEach(f => { rowObj[f.name] = document.getElementById(`f-${key}-${f.name}`).value; });
  if (cfg.scoped) rowObj.ScenarioID = currentScenarioId;

  const statusEl = document.getElementById(`status-${key}`);
  statusEl.textContent = '儲存中...';
  statusEl.className = 'status-msg';

  google.script.run
    .withSuccessHandler(() => {
      statusEl.textContent = '已儲存';
      statusEl.className = 'status-msg ok';
      resetForm(key);
      loadEntityData(key, cfg);
      if (key === 'scenarios') loadScenarioSelector(rowObj.ScenarioID);
    })
    .withFailureHandler(err => {
      statusEl.textContent = '錯誤：' + err.message;
      statusEl.className = 'status-msg err';
    })
    [cfg.saveFn](rowObj);
  return false;
}

function loadEntityData(key, cfg) {
  const args = cfg.scoped ? [currentScenarioId] : [];
  google.script.run
    .withSuccessHandler(safeHandler(rows => renderTable(key, cfg, rows || [])))
    .withFailureHandler(showGlobalError)
    [cfg.getFn](...args);
}

function renderTable(key, cfg, rows) {
  const container = document.getElementById('table-container-' + key);
  if (!rows.length) {
    container.innerHTML = '<p class="muted">尚無資料</p>';
    return;
  }
  const cols = cfg.fields.map(f => f.name);
  container.innerHTML = `
    <table>
      <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}<th>操作</th></tr></thead>
      <tbody>
        ${rows.map((r, i) => `
          <tr>
            ${cols.map(c => `<td>${r[c] !== undefined ? r[c] : ''}</td>`).join('')}
            <td>
              <button class="btn secondary" onclick='editRow("${key}", ${JSON.stringify(r).replace(/'/g, "&#39;")})'>編輯</button>
              <button class="btn danger" onclick="deleteRow('${key}', '${r[cfg.pk]}')">刪除</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function editRow(key, rowObj) {
  ENTITIES[key].fields.forEach(f => {
    const el = document.getElementById(`f-${key}-${f.name}`);
    if (el) el.value = rowObj[f.name] !== undefined ? rowObj[f.name] : '';
  });
}

function deleteRow(key, pkValue) {
  if (!confirm('確定要刪除這筆資料嗎？')) return;
  const cfg = ENTITIES[key];
  google.script.run.withSuccessHandler(() => loadEntityData(key, cfg))[cfg.deleteFn](pkValue);
}

/* ---------------- 儀表板 ---------------- */
function refreshDashboard() {
  const panel = document.getElementById('panel-dashboard');
  if (!currentScenarioId) {
    panel.querySelector('#dashboard-content').innerHTML = '<p class="muted">請先選擇情境</p>';
    return;
  }
  panel.querySelector('#dashboard-content').innerHTML = '<p class="muted">計算中...</p>';
  google.script.run
    .withSuccessHandler(safeHandler(result => renderDashboard(result)))
    .withFailureHandler(err => { panel.querySelector('#dashboard-content').innerHTML = '<p class="status-msg err">計算失敗：' + err.message + '</p>'; })
    .calculatePLAllVehicles(currentScenarioId);
}

function renderDashboard(result) {
  const content = document.getElementById('dashboard-content');
  const vehicleCols = result.vehicles.map(v => v.vehicleId);

  let rowsHtml = '';
  const lineDefs = result.weightedAverage;
  lineDefs.forEach(defLine => {
    const code = defLine.LineCode;
    const cells = result.vehicles.map(v => {
      const line = v.lines.find(l => l.LineCode === code);
      return fmtCell(line ? line.Amount : 0);
    }).join('');
    rowsHtml += `<tr><td>${code}</td><td>${defLine.LineName}</td>${cells}<td>${fmtCell(defLine.Amount)}</td></tr>`;
  });

  content.innerHTML = `
    <table class="pl-table">
      <thead><tr><th>科目</th><th>項目</th>${vehicleCols.map(c => `<th>${c}</th>`).join('')}<th>加權平均</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="charts-row">
      <div class="chart-box" id="chart-revenue"></div>
      <div class="chart-box" id="chart-waterfall"></div>
    </div>
  `;
  drawCharts(result);
}

function fmtCell(v) {
  const n = Number(v) || 0;
  const cls = n < 0 ? ' class="negative"' : '';
  return `<td${cls}>${n.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>`;
}

function drawCharts(result) {
  google.charts.setOnLoadCallback(() => {
    // 各車型收入結構(A) 長條圖
    const revData = new google.visualization.DataTable();
    revData.addColumn('string', '車型');
    revData.addColumn('number', '收入(A)');
    revData.addColumn('number', '營業淨利(K)');
    result.vehicles.forEach(v => {
      const a = v.lines.find(l => l.LineCode === 'A');
      const k = v.lines.find(l => l.LineCode === 'K');
      revData.addRow([v.vehicleId, a ? a.Amount : 0, k ? k.Amount : 0]);
    });
    new google.visualization.ColumnChart(document.getElementById('chart-revenue'))
      .draw(revData, { title: '各車型收入 vs 營業淨利', legend: { position: 'top' }, hAxis: {}, vAxis: { format: '#,###' } });

    // 加權平均損益瀑布(簡化為長條圖： C, E, G, I, K)
    const waterfallCodes = ['C', 'E', 'G', 'I', 'K'];
    const wfData = new google.visualization.DataTable();
    wfData.addColumn('string', '科目');
    wfData.addColumn('number', '金額');
    waterfallCodes.forEach(code => {
      const line = result.weightedAverage.find(l => l.LineCode === code);
      wfData.addRow([code, line ? line.Amount : 0]);
    });
    new google.visualization.ColumnChart(document.getElementById('chart-waterfall'))
      .draw(wfData, { title: '加權平均損益結構(生產毛利→營業淨利)', legend: { position: 'none' }, vAxis: { format: '#,###' } });
  });
}

function runDiagnostics() {
  const out = document.getElementById('diagnostics-output');
  out.style.display = 'block';
  out.textContent = '執行中...';
  google.script.run
    .withSuccessHandler(result => { out.textContent = JSON.stringify(result, null, 2); })
    .withFailureHandler(err => { out.textContent = '診斷失敗：' + err.message; })
    .runDiagnostics();
}

/* ---------------- 初始化 ---------------- */
window.addEventListener('DOMContentLoaded', () => {
  google.charts.load('current', { packages: ['corechart'] });
  loadScenarioSelector();
  switchTab('vehicles');
});
</script>
