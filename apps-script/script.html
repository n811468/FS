    fields: [
      { name: 'LineCode', label: '科目代碼(如b14)', required: true },
      { name: 'LineName', label: '科目名稱', required: true },
      { name: 'ParentLine', label: '父科目', type: 'select', options: [
        ['B', 'B 銷貨成本'], ['E', 'E 銷售費用(d類)'], ['G', 'G 產品貢獻前費用(f類)'], ['I', 'I 固定營業費用(h類)']
      ] },
      { name: 'Category', label: '分類(如成本明細/費用明細)' },

  },
  paramrates: {
    label: '參數設定 - 稅務/費用比率', pk: 'ParamID',
    getFn: 'getTaxRateParameters', saveFn: 'saveParameterRow', deleteFn: 'deleteParameterRow',
    scopedBy: 'scenario',
    fields: [
      { name: 'ParamID', label: 'ParamID', hiddenOnCreate: true },
      { name: 'VehicleID', label: '車系代號(留空=全車系適用)', type: 'select', dynamicVehicleOptions: true },
      { name: 'ParamName', label: '參數名稱', required: true, type: 'select', options: ['營業稅率', '銷售佣金率', '季Margin率', '貨物稅率'] },
      { name: 'Value', label: '比率%(請輸入0~100，如5代表5%)', type: 'number' },
      { name: 'EffectiveDate', label: '生效日', type: 'date' }
    ]
  },
  paramfx: {
    label: '參數設定 - 匯率設定', pk: 'ParamID',
    getFn: 'getFxParameters', saveFn: 'saveParameterRow', deleteFn: 'deleteParameterRow',
    scopedBy: 'scenario',
    note: '「現況匯率」會直接帶入銷貨成本頁的外幣金額換算，不需在成本列逐筆填匯率。',
    fields: [
      { name: 'ParamID', label: 'ParamID', hiddenOnCreate: true },
      { name: 'VehicleID', label: '車系代號(留空=全車系適用)', type: 'select', dynamicVehicleOptions: true },
      { name: 'ParamName', label: '參數名稱', required: true, type: 'select', options: ['集團預算匯率', '現況匯率'] },
      { name: 'Value', label: '匯率數值(非比率，不需轉百分比)', type: 'number' },
      { name: 'EffectiveDate', label: '生效日', type: 'date' }
    ]

let currentVehicleTypeId = '';
let currentScenarioId = '';
let currentTab = 'vehicletypes';

function switchTab(key) {
  currentTab = key;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
  if (key === 'dashboard') {
    loadComparisonPicker(); // 每次進入儀表板重抓車型/情境選項，才看得到剛新增的資料
  } else if (ENTITIES[key]) {
    renderEntityPanel(key);
  }
}

function loadVehicleTypeSelector(preferredId) {
  google.script.run
    .withSuccessHandler(safeHandler(types => {
      types = types || [];
      const sel = document.getElementById('vehicletype-selector');
      sel.innerHTML = '<option value="">-- 選擇車型 --</option>' +
        types.map(t => `<option value="${t.VehicleTypeID}">${t.VehicleTypeID}${t.VehicleTypeName ? ' - ' + t.VehicleTypeName : ''}</option>`).join('');
      const ids = types.map(t => t.VehicleTypeID);
      const pick = (preferredId && ids.indexOf(preferredId) !== -1) ? preferredId
        : (currentVehicleTypeId && ids.indexOf(currentVehicleTypeId) !== -1) ? currentVehicleTypeId
        : ids[0] || '';
      sel.value = pick;
      onVehicleTypeChange(pick);
    }))
    .withFailureHandler(showGlobalError)
    .getVehicleTypes();
}

function onVehicleTypeChange(value) {
  currentVehicleTypeId = value;
  currentScenarioId = '';
  if (ENTITIES[currentTab] && ENTITIES[currentTab].scopedBy === 'vehicleType') {
    renderEntityPanel(currentTab);
  }
  loadScenarioSelector();
}

function onScenarioChange(value) {
  currentScenarioId = value;
  document.querySelectorAll('.scenario-label').forEach(el => el.textContent = value || '(尚未選擇情境)');
  if (currentTab === 'dashboard') refreshDashboard();
  else if (ENTITIES[currentTab]) renderEntityPanel(currentTab);
}

function showGlobalError(err) {
  const box = document.getElementById('global-error');
  const msg = '發生錯誤：' + (err && err.message ? err.message : err);
  console.error(err);
  if (!box) { return; }
  box.textContent = msg;
  box.style.display = 'block';
}
function clearGlobalError() {
  const box = document.getElementById('global-error');
  if (box) box.style.display = 'none';
}

/** 包住 success handler 本體：伺服器呼叫成功後，前端渲染若還是丟例外，
 *  也要顯示在畫面上，而不是被 google.script.run 靜默吞掉、只留 console trace。 */
function safeHandler(fn) {
  return function () {
    try {
      clearGlobalError();
      return fn.apply(null, arguments);
    } catch (e) {
      showGlobalError(e);
    }
  };
}

/** 情境顯示名稱：GATE 別 + 自訂情境名稱（同一 GATE 下可有多個情境） */
function scenarioLabel(s) {
  return [s.Gate, s.ScenarioName].filter(v => v).join(' ') || s.ScenarioID;
}

function loadScenarioSelector(preferredId) {
  const sel = document.getElementById('scenario-selector');
  if (!currentVehicleTypeId) {
    sel.innerHTML = '<option value="">-- 請先選車型 --</option>';
    onScenarioChange('');
    return;
  }
  google.script.run
    .withSuccessHandler(safeHandler(scenarios => {
      scenarios = scenarios || [];
      sel.innerHTML = '<option value="">-- 選擇情境 --</option>' +
        scenarios.map(s => `<option value="${s.ScenarioID}">${scenarioLabel(s)}</option>`).join('');
      const ids = scenarios.map(s => s.ScenarioID);
      // 優先順序：剛新增/編輯的情境 > 目前已選的情境(若還存在) > 第一筆
      const pick = (preferredId && ids.indexOf(preferredId) !== -1) ? preferredId
        : (currentScenarioId && ids.indexOf(currentScenarioId) !== -1) ? currentScenarioId
        : ids[0] || '';
      sel.value = pick;
      onScenarioChange(pick);
    }))
    .withFailureHandler(showGlobalError)
    .getScenarios(currentVehicleTypeId);
}

/* ---------------- 通用表單/表格渲染 ---------------- */
function renderEntityPanel(key) {
  const cfg = ENTITIES[key];
  const panel = document.getElementById('panel-' + key);
  if (cfg.scopedBy === 'vehicleType' && !currentVehicleTypeId) {
    panel.innerHTML = '<p class="muted">請先在上方選擇車型</p>';
    return;
  }
  if (cfg.scopedBy === 'scenario' && (!currentVehicleTypeId || !currentScenarioId)) {
    panel.innerHTML = '<p class="muted">請先在上方選擇車型與情境</p>';
    return;
  }
  panel.innerHTML = `
    <h3>${cfg.label}</h3>
    ${cfg.note ? `<p class="muted">${cfg.note}</p>` : ''}
    <div id="form-container-${key}"></div>
    <div id="status-${key}" class="status-msg"></div>
    <div id="table-container-${key}"></div>
  `;
  renderForm(key, cfg);
  loadEntityData(key, cfg);
  if (key === 'salesmix') renderSalesMixTools();
}

function renderForm(key, cfg) {
  const container = document.getElementById('form-container-' + key);
  const fieldsHtml = cfg.fields.map(f => {
    const id = `f-${key}-${f.name}`;
    if (f.hiddenOnCreate) {
      // RowID/ParamID 等系統自動產生的主鍵欄位：不用讓使用者看到空文字框，
      // 但編輯既有資料時(editRow)仍要能寫回這個 id，所以保留一個 hidden input。
      return `<input type="hidden" id="${id}"/>`;
    }
    let control;
    if (f.type === 'select') {
      control = `<select id="${id}"><option value=""></option></select>`;
    } else if (f.type === 'text-suggest') {
      control = `<input id="${id}" type="text" list="dl-${id}"/><datalist id="dl-${id}"></datalist>`;
    } else {
      control = `<input id="${id}" type="${f.type || 'text'}" step="any"${f.required ? ' required' : ''}${f.readOnly ? ' readonly' : ''}/>`;
    }
    return `<label>${f.label}${f.required ? ' *' : ''} ${control}</label>`;
  }).join('');

  container.innerHTML = `
    <form class="entry-form" onsubmit="return submitEntityForm(event, '${key}')">
      ${fieldsHtml}
      <input type="hidden" id="edit-pk-${key}" value=""/>
      <button type="submit" class="btn">儲存</button>
      <button type="button" class="btn secondary" onclick="resetForm('${key}')">清空</button>
    </form>
  `;

  cfg.fields.forEach(f => {
    if (f.dynamicVehicleOptions) {
      // 車系代號選單依「目前選擇的車型」動態帶出底下的車系，而非固定選項或全域清單。
      google.script.run
        .withSuccessHandler(safeHandler(list => {
          const sel = document.getElementById(`f-${key}-${f.name}`);
          (list || []).forEach(v => sel.insertAdjacentHTML('beforeend', `<option value="${v.VehicleID}">${v.VehicleID}${v.VehicleCode ? ' - ' + v.VehicleCode : ''}</option>`));
        }))
        .withFailureHandler(showGlobalError)
        .getVehicles(currentVehicleTypeId);
    } else if (f.type === 'select' && f.options) {
      const sel = document.getElementById(`f-${key}-${f.name}`);
      f.options.forEach(opt => {
        const [val, text] = Array.isArray(opt) ? opt : [opt, opt];
        sel.insertAdjacentHTML('beforeend', `<option value="${val}">${text}</option>`);
      });
    } else if (f.optionsFn) {
      google.script.run
        .withSuccessHandler(safeHandler(list => {
          list = list || [];
          if (f.type === 'text-suggest') {
            const dl = document.getElementById(`dl-f-${key}-${f.name}`);
            dl.innerHTML = list.map(v => `<option value="${v}">`).join('');
          } else {
            // 選項可以是純字串，也可以是 {value, label}（科目選單用後者，值存代碼、顯示名稱）
            const sel = document.getElementById(`f-${key}-${f.name}`);
            list.forEach(v => {
              const val = (v && v.value !== undefined) ? v.value : v;
              const text = (v && v.label !== undefined) ? v.label : v;
              sel.insertAdjacentHTML('beforeend', `<option value="${val}">${text}</option>`);
            });
          }
        }))
        .withFailureHandler(showGlobalError)
        [f.optionsFn]();
    }
  });
}

function resetForm(key) {
  ENTITIES[key].fields.forEach(f => { document.getElementById(`f-${key}-${f.name}`).value = ''; });
  document.getElementById(`edit-pk-${key}`).value = '';
}

function submitEntityForm(evt, key) {
  evt.preventDefault();
  const cfg = ENTITIES[key];
  const rowObj = {};
  cfg.fields.forEach(f => { rowObj[f.name] = document.getElementById(`f-${key}-${f.name}`).value; });
  if (cfg.scopedBy === 'scenario') rowObj.ScenarioID = currentScenarioId;
  if (cfg.scopedBy === 'vehicleType') rowObj.VehicleTypeID = currentVehicleTypeId;

  const statusEl = document.getElementById(`status-${key}`);
  statusEl.textContent = '儲存中...';
  statusEl.className = 'status-msg';

  google.script.run
    .withSuccessHandler(() => {
      statusEl.textContent = '已儲存';
      statusEl.className = 'status-msg ok';
      resetForm(key);
      loadEntityData(key, cfg);
      if (key === 'vehicletypes') loadVehicleTypeSelector(rowObj.VehicleTypeID);
      if (key === 'scenarios') loadScenarioSelector(rowObj.ScenarioID);
    })
    .withFailureHandler(err => {
      statusEl.textContent = '錯誤：' + err.message;
      statusEl.className = 'status-msg err';
    })
    [cfg.saveFn](rowObj);
  return false;
}

function loadEntityData(key, cfg) {
  const args = cfg.scopedBy === 'scenario' ? [currentScenarioId]
    : cfg.scopedBy === 'vehicleType' ? [currentVehicleTypeId]
    : [];
  google.script.run
    .withSuccessHandler(safeHandler(rows => renderTable(key, cfg, rows || [])))
    .withFailureHandler(showGlobalError)
    [cfg.getFn](...args);
}

function renderTable(key, cfg, rows) {
  const container = document.getElementById('table-container-' + key);
  if (!rows.length) {
    container.innerHTML = '<p class="muted">尚無資料</p>';
    return;
  }
  const cols = cfg.fields.map(f => f.name);
  container.innerHTML = `
    <table>
      <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}<th>操作</th></tr></thead>
      <tbody>
        ${rows.map((r, i) => `
          <tr>
            ${cols.map(c => `<td>${r[c] !== undefined ? r[c] : ''}</td>`).join('')}
            <td>
              <button class="btn secondary" onclick='editRow("${key}", ${JSON.stringify(r).replace(/'/g, "&#39;")})'>編輯</button>
              <button class="btn danger" onclick="deleteRow('${key}', '${r[cfg.pk]}')">刪除</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function editRow(key, rowObj) {
  ENTITIES[key].fields.forEach(f => {
    const el = document.getElementById(`f-${key}-${f.name}`);
    if (el) el.value = rowObj[f.name] !== undefined ? rowObj[f.name] : '';
  });
}

function deleteRow(key, pkValue) {
  if (!confirm('確定要刪除這筆資料嗎？')) return;
  const cfg = ENTITIES[key];
  google.script.run.withSuccessHandler(() => {
    loadEntityData(key, cfg);
    if (key === 'vehicletypes') loadVehicleTypeSelector();
    if (key === 'scenarios') loadScenarioSelector();
  })[cfg.deleteFn](pkValue);
}

/* ---------------- 銷售構成：台數/百分比雙向換算工具列 ---------------- */
function renderSalesMixTools() {
  const panel = document.getElementById('panel-salesmix');
  const tableContainer = document.getElementById('table-container-salesmix');
  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = `
    <button type="button" class="btn secondary" onclick="recalcSalesMixByVolume()">依台數重算百分比</button>
    <label style="display:flex;align-items:center;gap:6px;">
      情境總銷售台數(月)：<input id="salesmix-total-volume" type="number" step="any" style="width:100px;">
    </label>
    <button type="button" class="btn secondary" onclick="recalcSalesMixByPct()">依百分比反推台數</button>
    <span class="muted">LIFE CYCLE總台數 = 預估銷售台數(月) &times; 12 &times; LC年限，於損益試算時自動計算</span>
  `;
  panel.insertBefore(toolbar, tableContainer);
}

function recalcSalesMixByVolume() {
  google.script.run
    .withSuccessHandler(safeHandler(rows => renderTable('salesmix', ENTITIES.salesmix, rows || [])))
    .withFailureHandler(showGlobalError)
    .recalcSalesMixPctByVolume(currentScenarioId);
}

function recalcSalesMixByPct() {
  const total = document.getElementById('salesmix-total-volume').value;
  google.script.run
    .withSuccessHandler(safeHandler(rows => renderTable('salesmix', ENTITIES.salesmix, rows || [])))
    .withFailureHandler(showGlobalError)
    .recalcSalesMixVolumeByPct(currentScenarioId, total);
}

/* ---------------- 儀表板：多車型 / 多情境比較 ---------------- */
let comparisonOptions = [];               // 車型 -> 情境/車系 選項樹
let comparisonSelections = [];            // [{ScenarioID, VehicleID}]，VehicleID 空字串 = 加權平均

function loadComparisonPicker() {
  google.script.run
    .withSuccessHandler(safeHandler(options => {
      comparisonOptions = options || [];
      renderComparisonPicker();
      // 首次進入時，用目前上方選到的車型/情境的加權平均當預設比較欄位
      if (!comparisonSelections.length && currentScenarioId) {
        comparisonSelections.push({ ScenarioID: currentScenarioId, VehicleID: '' });
      }
      renderComparisonColumns();
      refreshDashboard();
    }))
    .withFailureHandler(showGlobalError)
    .getComparisonOptions();
}

function renderComparisonPicker() {
  const picker = document.getElementById('comparison-picker');
  if (!comparisonOptions.length) {
    picker.innerHTML = '<p class="muted">尚無車型資料，請先在「車型主檔」建立車型。</p>';
    return;
  }
  picker.innerHTML = `
    <label style="display:flex;align-items:center;gap:6px;">車型：
      <select id="cmp-vehicletype" onchange="onComparisonTypeChange()">
        ${comparisonOptions.map(t => `<option value="${t.VehicleTypeID}">${t.VehicleTypeID}${t.VehicleTypeName ? ' - ' + t.VehicleTypeName : ''}</option>`).join('')}
      </select>
    </label>
    <label style="display:flex;align-items:center;gap:6px;">情境：<select id="cmp-scenario"></select></label>
    <label style="display:flex;align-items:center;gap:6px;">車系：<select id="cmp-vehicle"></select></label>
    <button type="button" class="btn" onclick="addComparisonColumn()">加入比較欄位</button>
  `;
  onComparisonTypeChange();
}

function onComparisonTypeChange() {
  const typeId = document.getElementById('cmp-vehicletype').value;
  const type = comparisonOptions.find(t => t.VehicleTypeID === typeId);
  const scenarioSel = document.getElementById('cmp-scenario');
  const vehicleSel = document.getElementById('cmp-vehicle');
  if (!type) { scenarioSel.innerHTML = ''; vehicleSel.innerHTML = ''; return; }

  scenarioSel.innerHTML = type.scenarios.length
    ? type.scenarios.map(s => `<option value="${s.ScenarioID}">${scenarioLabel(s)}</option>`).join('')
    : '<option value="">(此車型尚無情境)</option>';
  // 車系可以個別選，也可以選該情境的加權平均
  vehicleSel.innerHTML = '<option value="">加權平均</option>' +
    type.vehicles.map(v => `<option value="${v.VehicleID}">${v.VehicleID}${v.VehicleCode ? ' - ' + v.VehicleCode : ''}</option>`).join('');
}

function addComparisonColumn() {
  const scenarioId = document.getElementById('cmp-scenario').value;
  const vehicleId = document.getElementById('cmp-vehicle').value;
  if (!scenarioId) { showGlobalError('此車型尚無情境，請先在「情境設定」建立情境。'); return; }
  if (comparisonSelections.some(s => s.ScenarioID === scenarioId && s.VehicleID === vehicleId)) return;
  comparisonSelections.push({ ScenarioID: scenarioId, VehicleID: vehicleId });
  renderComparisonColumns();
  refreshDashboard();
}

function removeComparisonColumn(idx) {
  comparisonSelections.splice(idx, 1);
  renderComparisonColumns();
  refreshDashboard();
}

function renderComparisonColumns() {
  const box = document.getElementById('comparison-columns');
  if (!comparisonSelections.length) {
    box.innerHTML = '<p class="muted">尚未加入比較欄位。</p>';
    return;
  }
  box.innerHTML = '<div class="toolbar">' + comparisonSelections.map((sel, i) => {
    const type = comparisonOptions.find(t => t.scenarios.some(s => s.ScenarioID === sel.ScenarioID));
    const scenario = type && type.scenarios.find(s => s.ScenarioID === sel.ScenarioID);
    const vehicle = type && type.vehicles.find(v => v.VehicleID === sel.VehicleID);
    const label = [
      type ? type.VehicleTypeID : '',
      scenario ? scenarioLabel(scenario) : sel.ScenarioID,
      sel.VehicleID ? ((vehicle && vehicle.VehicleCode) || sel.VehicleID) : '加權平均'
    ].filter(p => p).join(' / ');
    return `<span class="cmp-chip">${label}
      <button type="button" class="btn danger" onclick="removeComparisonColumn(${i})">移除</button></span>`;
  }).join('') + '</div>';
}

function refreshDashboard() {
  const content = document.getElementById('dashboard-content');
  if (!comparisonOptions.length) { loadComparisonPicker(); return; }
  if (!comparisonSelections.length) {
    content.innerHTML = '<p class="muted">請先加入至少一個比較欄位。</p>';
    return;
  }
  content.innerHTML = '<p class="muted">計算中...</p>';
  google.script.run
    .withSuccessHandler(safeHandler(result => renderDashboard(result)))
    .withFailureHandler(err => { content.innerHTML = '<p class="status-msg err">計算失敗：' + err.message + '</p>'; })
    .calculateComparison(comparisonSelections);
}

function renderDashboard(result) {
  const content = document.getElementById('dashboard-content');
  const cols = result.columns || [];

  const rowsHtml = (result.lines || []).map(line => {
    const cells = cols.map(col => {
      const v = col.amounts[line.LineCode];
      // 不同車型的科目不見得相同，該欄位沒有這個科目就留白，不要顯示 0 誤導
      return v === undefined || v === null ? '<td class="muted">—</td>' : fmtCell(v);
    }).join('');
    const autoTag = line.AutoSource ? ' <span class="auto-tag">自動</span>' : '';
    return `<tr><td>${line.LineCode}</td><td>${line.LineName}${autoTag}</td>${cells}</tr>`;
  }).join('');

  content.innerHTML = `
    <table class="pl-table">
      <thead><tr><th>科目</th><th>項目</th>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="charts-row">
      <div class="chart-box" id="chart-revenue"></div>
    </div>
  `;
  drawCharts(result);
}

function fmtCell(v) {
  const n = Number(v) || 0;
  const cls = n < 0 ? ' class="negative"' : '';
  return `<td${cls}>${n.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>`;
}

function drawCharts(result) {
  google.charts.setOnLoadCallback(() => {
    // 各比較欄位的收入(A) vs 營業淨利(K)
    const revData = new google.visualization.DataTable();
    revData.addColumn('string', '比較欄位');
    revData.addColumn('number', '收入(A)');
    revData.addColumn('number', '營業淨利(K)');
    (result.columns || []).forEach(col => {
      revData.addRow([col.label, Number(col.amounts.A) || 0, Number(col.amounts.K) || 0]);
    });
    new google.visualization.ColumnChart(document.getElementById('chart-revenue'))
      .draw(revData, { title: '各比較欄位：收入 vs 營業淨利', legend: { position: 'top' }, vAxis: { format: '#,###' } });
  });
}

function runDiagnostics() {
  const out = document.getElementById('diagnostics-output');
  out.style.display = 'block';
  out.textContent = '執行中...';
  google.script.run
    .withSuccessHandler(result => { out.textContent = JSON.stringify(result, null, 2); })
    .withFailureHandler(err => { out.textContent = '診斷失敗：' + err.message; })
    .runDiagnostics();
}

/* ---------------- 初始化 ---------------- */
window.addEventListener('DOMContentLoaded', () => {
  google.charts.load('current', { packages: ['corechart'] });
  switchTab('vehicletypes');
  loadVehicleTypeSelector();
});
</script>
