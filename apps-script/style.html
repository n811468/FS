<style>
  body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  header { background: #1f2d3d; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 20px; }
  header h1 { font-size: 18px; margin: 0; }
  /* 導覽列分三個主軸：車型與情境 / 損益項目與計算 / 結果呈現。
     每一組是「小標題 + 該組的分頁按鈕」，組與組之間用分隔線隔開，
     讓使用者一眼看得出這個系統分成哪幾塊、現在站在哪一塊。 */
  nav { display: flex; gap: 0; padding: 6px 20px 8px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  .nav-group { display: flex; flex-direction: column; gap: 3px; padding: 2px 16px; border-left: 1px solid #cbd5e0; }
  .nav-group:first-child { padding-left: 0; border-left: none; }
  .nav-group-label { font-size: 11px; font-weight: 600; color: #718096; letter-spacing: .08em; padding-left: 6px; }
  .nav-group-tabs { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
  /* 同一組裡再細分「主要輸入」與「設定類」兩段，中間補一個淡分隔 */
  .nav-sep { width: 1px; height: 16px; background: #edf2f7; margin: 0 4px; }
  nav button { border: none; background: transparent; padding: 7px 13px; cursor: pointer; font-size: 14px; border-radius: 4px; white-space: nowrap; }
  nav button:hover:not(.active) { background: #f0f2f5; }
  nav button.active { background: #1f2d3d; color: #fff; }
  /* 比較欄位一多就會超出 1200px，改成撐滿視窗、由表格自己橫向捲動 */
  main { padding: 20px; max-width: 1800px; margin: 0 auto; }
  .panel { display: none; background: #fff; border-radius: 6px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .panel.active { display: block; }
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  select, input[type=text], input[type=number], input[type=date] {
    padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
  }
  /* 數字欄位的呈現要一致：不管在哪個頁面，數字一律靠右對齊（跟旁邊唯讀的計算欄位對得起來） */
  input[type=number] { text-align: right; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 12px; }
  th, td { border: 1px solid #e0e0e0; padding: 6px 8px; text-align: right; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  thead { background: #f0f2f5; }
  tbody tr:hover { background: #fafbfc; }
  form.entry-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 10px; padding: 12px; background: #f9fafb; border-radius: 6px; }
  form.entry-form label { display: flex; flex-direction: column; font-size: 12px; color: #555; gap: 3px; }
  .btn { background: #2b6cb0; color: #fff; border: none; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .btn.secondary { background: #718096; }
  .btn.danger { background: #c53030; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .muted { color: #888; font-size: 12px; }
  .pl-table td.negative { color: #c53030; }
  .status-msg { font-size: 12px; padding: 4px 0; }
  .status-msg.ok { color: #2f855a; }
  .status-msg.err { color: #c53030; }
  /* 表格編輯頁：整張表直接編輯，欄位緊湊一點才看得到全部車系 */
  table.grid-table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 10px; }
  table.grid-table th, table.grid-table td { border: 1px solid #e0e0e0; padding: 4px 6px; text-align: right; }
  table.grid-table thead { background: #f0f2f5; }
  table.grid-table th { text-align: center; white-space: nowrap; }
  table.grid-table td.row-head { text-align: left; white-space: nowrap; background: #fafbfc; }
  table.grid-table td.calc { background: #f7fafc; color: #2d3748; }
  table.grid-table tfoot td { font-weight: 600; background: #edf2f7; }
  table.grid-table input[type=number] { width: 92px; text-align: right; padding: 4px 6px; }
  table.grid-table input[type=text] { width: 120px; padding: 4px 6px; }
  /* 數字靠右、文字靠左。
     儲存格預設靠右是為了讓數字對齊，但格子裡放的是文字輸入框或下拉選單時，
     靠右會把整個輸入框推到格子右邊 —— 每一列的選單寬度不一樣時，左邊界就參差不齊。
     這裡把「裝著文字輸入框/日期/下拉選單」的格子改成靠左，數字欄位維持靠右不受影響。
     (:has() 在很舊的瀏覽器不支援，那種情況只會退回原本的靠右，不會壞掉) */
  table.grid-table td:has(> input[type=text]),
  table.grid-table td:has(> input[type=date]),
  table.grid-table td:has(> select) { text-align: left; }
  /* text-align 會從儲存格繼承進輸入框，所以框「裡面」的文字也要明確指定靠左 */
  table.grid-table input[type=text],
  table.grid-table input[type=date],
  table.grid-table select { text-align: left; }
  table.grid-table input, table.grid-table select { border: 1px solid #cbd5e0; border-radius: 3px; font-size: 13px; }
  table.grid-table input:focus { outline: 2px solid #90cdf4; border-color: #2b6cb0; }
  .toolbar-sep { border-left: 1px solid #cbd5e0; height: 22px; }
  .summary-box { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; padding: 10px 14px;
    background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; }
  .summary-box div { display: flex; flex-direction: column; gap: 2px; }
  .type-badge { background: #2b6cb0; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .csv-box { width: 100%; height: 160px; font-family: monospace; font-size: 12px; margin-bottom: 10px; }
  .pl-table tr.subtotal { background: #f7fafc; font-weight: 600; }
  .cmp-chip { display: inline-flex; align-items: stretch; gap: 0; background: #edf2f7; border: 1px solid #cbd5e0;
    border-radius: 100px; overflow: hidden; font-size: 12px; }
  .cmp-chip .chip-label { display: flex; align-items: center; padding: 3px 8px; font-weight: 600; color: #2d3748; white-space: nowrap; }
  .cmp-chip .chip-move { background: transparent; border: none; color: #718096; cursor: pointer; font-size: 11px; padding: 0 4px; }
  .cmp-chip .chip-move:hover:not(:disabled) { color: #2b6cb0; }
  .cmp-chip .chip-move:disabled { opacity: .3; cursor: not-allowed; }
  .cmp-chip .btn { padding: 2px 8px; font-size: 11px; border-radius: 0; margin: 0; }
  .cmp-chip { cursor: grab; }
  .cmp-chip.dragging { opacity: .4; }
  .cmp-chip .chip-handle { display: flex; align-items: center; padding: 0 2px 0 8px; color: #a0aec0; font-size: 13px; cursor: grab; }

  /* ---- 儀表板：建構欄位卡片，選擇跟已加入的比較欄位放在同一張卡，不必分散找 ---- */
  .dash-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .dash-head h3 { margin: 0; }
  .builder-card { background: #f9fafb; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .builder-card .toolbar { margin-bottom: 10px; }
  .builder-card .chip-row-label { font-size: 11px; color: #718096; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .auto-tag { font-size: 10px; color: #2b6cb0; border: 1px solid #90cdf4; border-radius: 3px; padding: 0 3px; margin-left: 4px; }
  .charts-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; align-items: stretch; }
  .chart-box { flex: 2 1 420px; min-height: 320px; background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 8px; }
  /* 柱狀圖科目勾選框直接靠在圖旁邊，選了就近看到圖重畫，不必跟圖隔著一整張損益表；
     勾選框本身就是圖例(legend)，順便顯示目前的金額，一眼看得出勾的是哪個科目 */
  .chart-picker-box { flex: 1 1 260px; min-width: 220px; background: #f9fafb; border: 1px solid #e2e8f0;
    border-radius: 6px; padding: 10px 12px; }
  .legend-list { display: flex; flex-direction: column; gap: 1px; max-height: 260px; overflow-y: auto; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; cursor: pointer; font-size: 12.5px; }
  .legend-item:hover { background: #edf2f7; }
  .legend-item input { margin: 0; }
  .legend-item .legend-name { flex: 1; color: #4a5568; }
  .legend-item.on .legend-name { color: #1a202c; font-weight: 600; }
  .legend-item .legend-val { font-size: 11px; color: #a0aec0; font-variant-numeric: tabular-nums; }
  .legend-source-hint { font-size: 11px; color: #a0aec0; margin-bottom: 6px; }

  /* ---- 表格橫向捲動：欄位多的頁面(銷售構成、成本矩陣、儀表板)不再把輸入框擠出畫面 ---- */
  .grid-scroll { overflow-x: auto; max-width: 100%; padding-bottom: 4px; }
  .grid-scroll table { min-width: max-content; }
  th .th-sub { font-weight: 400; font-size: 11px; color: #718096; }
  table.grid-table input[type=number] { width: 84px; }
  table.grid-table input.note-input { width: 110px; }

  /* 橫向捲動時把最左邊的科目/車系欄釘住，捲到右邊還看得出在看哪一列 */
  table.sticky-head-col td.row-head,
  table.sticky-head-col thead th:first-child { position: sticky; left: 0; z-index: 2; }
  table.sticky-head-col td.row-head { background: #fafbfc; }
  table.sticky-head-col thead th:first-child { z-index: 3; background: #f0f2f5; }

  label.chk { display: inline-flex; flex-direction: row; align-items: center; gap: 4px; font-size: 12px; color: #444; }
  .toolbar label { display: flex; flex-direction: column; font-size: 12px; color: #555; gap: 3px; }
  .toolbar-block { width: 100%; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 12px; margin-top: 8px; background: #f9fafb; }
  .toolbar-block-title { font-size: 12px; font-weight: 600; color: #4a5568; margin-bottom: 4px; }
  .toolbar-block .toolbar { margin-bottom: 6px; }
  table.entity-table td.calc { color: #4a5568; }
  table.entity-table tr.new-row td { background: #fffaf0; }
  td.row-actions { white-space: nowrap; }
  .row-move { padding: 3px 7px; font-size: 11px; line-height: 1; }
  .col-move { display: flex; justify-content: center; gap: 2px; margin-bottom: 2px; }
  .col-move .row-move { font-weight: 400; }

  /* ---- 損益表：版面比照實際損益試算表，小計整列反白、明細縮排 ---- */
  .pl-table thead th { text-align: center; white-space: nowrap; }
  .pl-table td.row-head, .pl-table thead th:first-child {
    position: sticky; left: 0; z-index: 2; text-align: left; white-space: nowrap; background: #fff;
  }
  .pl-table thead th:first-child { z-index: 3; background: #f0f2f5; }
  .pl-table tr.detail td.row-head { padding-left: 22px; color: #4a5568; }
  .pl-table td.pct { color: #4a5568; font-size: 12px; }
  /* 科目名稱後的公式平常隱藏，滑鼠移到 ƒ 圖示（或自動計算的圓點）上才顯示提示。
     用 data-tip + 自己寫的 fixed 定位 tooltip(見 script.html 的 installTooltipEngine_)，
     不用瀏覽器原生 title —— 原生 title 在有橫向捲動/sticky 釘住欄位的表格裡常常被裁掉看不到。 */
  .formula-hint { display: inline-block; color: #a0aec0; border: 1px solid #cbd5e0; border-radius: 3px;
    font-size: 10px; line-height: 1; padding: 1px 3px; cursor: help; font-style: italic; vertical-align: middle; margin-left: 3px; }
  .formula-hint:hover, .formula-hint:focus-visible { color: #2b6cb0; border-color: #90cdf4; outline: none; }
  .auto-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2b6cb0;
    vertical-align: middle; margin-left: 5px; cursor: help; }
  [data-tip] { -webkit-tap-highlight-color: transparent; }
  .js-tooltip { position: fixed; z-index: 999; display: none; max-width: 300px; background: #1a202c; color: #fff;
    font-size: 11.5px; line-height: 1.6; padding: 8px 11px; border-radius: 6px; white-space: pre-line;
    box-shadow: 0 8px 20px -6px rgba(0,0,0,.4); pointer-events: none; }
  /* 大項可收合：B/E/G/I 小計列前面的箭頭，收合時把底下的明細列整個藏起來 */
  .row-toggle { appearance: none; border: none; background: transparent; padding: 0; margin-right: 4px; cursor: pointer;
    color: inherit; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px;
    vertical-align: middle; }
  .row-toggle svg { width: 10px; height: 10px; transition: transform .15s; }
  .row-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .pl-table tr.detail[hidden] { display: none; }
  /* 小計/區段列的底色要蓋過上面釘住欄位的白底，所以放在後面 */
  .pl-table tr.subtotal td { background: #fffbe6; font-weight: 600; }
  .pl-table tr.section td { background: #edf2f7; font-weight: 600; text-align: left; color: #2d3748; }
  .chip-picker { display: flex; flex-wrap: wrap; gap: 2px 14px; max-height: 110px; overflow-y: auto;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; padding: 6px 10px; }
  .chip-picker label.chk { white-space: nowrap; }
  .check-box { background: #fffaf0; border: 1px solid #f6ad55; border-radius: 6px; padding: 8px 14px; font-size: 13px; color: #7b341e; }
  .check-box ul { margin: 6px 0 0; padding-left: 20px; }

  /* ---- 情境差異卡片：使用者自選要比較的兩個欄位，一張卡看一組差異 ---- */
  .diff-section { margin-bottom: 16px; }
  .diff-cards-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .diff-card { flex: 1 1 360px; min-width: 320px; background: #f9fafb; border: 1px solid #e2e8f0;
    border-radius: 8px; padding: 12px 14px; }
  .diff-card-title { font-size: 13px; font-weight: 600; color: #2d3748; margin-bottom: 8px; }
  .diff-card-title .diff-arrow { color: #a0aec0; margin: 0 4px; }
  .diff-table { margin-top: 0; font-size: 12.5px; }
  .diff-table tr.subtotal { background: #fffbe6; font-weight: 600; }
  .diff-table td.negative, .diff-table th.negative { color: #c53030; }
  .diff-chart-box { margin-top: 10px; min-height: 220px; background: #fff; border: 1px solid #eee;
    border-radius: 6px; padding: 6px; }
</style>
